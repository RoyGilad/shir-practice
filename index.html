<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<title>טיוטת תרגול</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:#eef2f5;color:#1b2a33;font-size:18px}
header{background:#1d7f8c;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:20px;margin:0}
header .note{font-size:13px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
button{font:inherit;cursor:pointer;border:1px solid #1d7f8c;background:#fff;color:#1d7f8c;border-radius:8px;padding:8px 16px}
button.primary{background:#1d7f8c;color:#fff}
button:disabled{opacity:.4;cursor:default}
button.danger{border-color:#b33;color:#b33}
select{font:inherit;padding:6px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chip{display:inline-block;background:#e3f1f3;border-radius:12px;padding:2px 10px;font-size:14px;margin-inline-start:6px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.bar button{min-width:42px;padding:6px 8px}
.bar .cur{background:#1d7f8c;color:#fff}
.bar .ans{background:#cfe8d5}
.bar .flg{border-color:#d08a00;box-shadow:inset 0 0 0 2px #f2b84b}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-weight:bold;font-size:22px;color:#1d7f8c}
.timer.low{color:#c22}
.q{font-size:22px;line-height:1.6;margin:14px 0;white-space:pre-line}
.tap{min-height:44px;min-width:44px;padding:10px 16px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border:2px solid #b8c7cc;border-radius:10px;background:#fff;color:#1b2a33}
.opt.sel{border-color:#1d7f8c;background:#e3f1f3}
.opt.good{border-color:#2a9d4b;background:#dff3e4}
.opt.bad{border-color:#c33;background:#fbe3e3}
.opt .mark{flex:0 0 auto;width:1.25em;font-size:22px;font-weight:bold;line-height:1;text-align:center}
.opt.good .mark{color:#1e7a38}
.opt.bad .mark{color:#a32020}
button.opt:disabled{opacity:1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-top:1px solid #d5e1e4;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(27,42,51,.06)}
.optsvg{display:flex;flex-wrap:wrap;gap:12px}
.optsvg .opt{width:auto;padding:6px}
.seq{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;direction:ltr;unicode-bidi:isolate;justify-content:flex-start;overflow-x:auto;max-width:100%;padding-bottom:4px}
.seq .step{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;gap:2px}
.seq .sn{font-size:13px;font-weight:bold;line-height:1;color:#1d7f8c}
.formula{direction:ltr;unicode-bidi:isolate;display:inline-block}
.box{border:2px solid #888;border-radius:8px;background:#fff;padding:2px;display:inline-block}
.qmark{display:flex;align-items:center;justify-content:center;font-size:44px;color:#999;width:88px;height:88px}
.matrix{display:grid;grid-template-columns:repeat(3,92px);gap:6px;justify-content:center;direction:ltr;unicode-bidi:isolate;overflow-x:auto;max-width:100%}
.seq .qmark{width:64px;height:64px;font-size:28px}
.ord{list-style:none;padding:0;margin:10px 0}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #b8c7cc;border-radius:10px;padding:8px 12px;margin:6px 0;cursor:grab;touch-action:none;user-select:none}
.ord li .n{font-weight:bold;color:#1d7f8c;width:22px}
.ord li span.t{flex:1}
.ord li.drag{opacity:.4}
.ord li.over{border-color:#1d7f8c;background:#f3fbfb}
.ord.lock li{cursor:default;touch-action:auto}
.ord button{padding:2px 10px;touch-action:manipulation}
input[type=text]{font:inherit;padding:10px;border:2px solid #b8c7cc;border-radius:8px;width:200px;direction:ltr;text-align:center}
.exp{background:#fff7e0;border-radius:8px;padding:10px 14px;margin-top:10px;white-space:pre-line}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:right}
.ok{color:#2a9d4b;font-weight:bold}.no{color:#c33;font-weight:bold}
.small{font-size:14px;color:#556}
.pbar{background:#dde;border-radius:6px;height:8px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:#1d7f8c}
details.card>summary{cursor:pointer;font-weight:bold;font-size:18px;min-height:44px;display:flex;align-items:center}
details.card>summary+p{margin-top:12px}
.chart{margin:12px 0;padding:12px;background:#f4fafa;border-radius:8px}
.chart b{display:block;margin-bottom:8px}
.bars{display:flex;gap:12px;align-items:flex-end;justify-content:center;direction:ltr;min-height:140px}
.bars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:72px}
.bars .bar{display:block;width:36px;background:#1d7f8c;border-radius:6px 6px 0 0}
.bars .lab{font-size:14px;margin-top:4px}
</style>
</head>

 החלקים.", "id": "q4", "level": 1, "example": "דוגמה: \"הגשם ירד, ולכן לקחנו מטרייה\". בודקים קשר סיבה ותוצאה, וקוראים שוב את המשפט השלם.", "checked": true, "review": "Instinct revised after Arch independent challenge; re-review pending", "origin": "legacy-revised"}, {"t": "mc", "ch": 1, "sub": "nonsense", "q": "אמא אפתה פלדוק טעים לכבוד החג.\nבאיזה משפט למילת התפל ״פלדוק״ יש משמעות דומה?", "opts": ["פלדוק הנעליים נקשר בחוזקה.", "הילדים אכלו פלדוק עם חמאה וריבה.", "הפלדוק של הטלפון נגמר.", "הנהג לחץ על הפלדוק ברגלו."], "ans": 1, "exp": "הפועל \"אפתה\" מרמז על מאפה שאוכלים. גם במשפט \"הילדים אכלו פלדוק עם חמאה וריבה\" מדובר במאכל.", "id": "q5", "level": 1, "example": "דוגמה: \"דני שתה זלמוק מכוס\". גם אם המילה אינה מוכרת, הפועל והכלי מרמזים על משקה. מחפשים שימוש דומה באפשרויות.", "checked": true, "review": "Instinct revised after Arch independent challenge; re-review pending", "origin": "legacy"}, {"t": "mc", "ch": 1, "sub": "nonsense", "q": "הדוור הניח את הברמץ בתיבת הדואר.\nבאיזה משפט למילת התפל ״ברמץ״ יש משמעות דומה?", "opts": ["ירד ברמץ כבד כל הלילה.", "קיבלתי ברמץ מסבתא בדואר, ובו תמונות.", "הילד ברמץ מהר מאוד.", "הברמץ של הסלון חם ונעים."], "ans": 1, "exp": "הדוור ותיבת הדואר מרמזים על דבר שנשלח בדואר, כגון מכתב או חבילה. גם במשפט על ברמץ מסבתא ובו תמונות מדובר בדבר שהגיע בדואר.", "id": "q6", "level": 1, "example": "דוגמה: \"דני שתה זלמוק מכוס\". גם אם המילה אינה מוכרת, הפועל והכלי מרמזים על משקה. מחפשים שימוש דומה באפשרויות.", "checked": true, "review": "Instinct revised after Arch independent challenge; re-review pending", "origin": "legacy"}, {"t": "mc", "ch": 1, "sub": "next", "q": "יעל הבטיחה לחזור מוקדם מהמסיבה, אך חזרה רק אחרי חצות.\nאיזה משפט מתאים להמשך הסיפור?", "opts": ["אמה חיכתה לה בדאגה ליד הדלת.", "אמה שמחה מאוד שהגיעה בזמן.", "יעל לא הלכה למסיבה בכלל.", "המסיבה הסתיימה לפני שהתחילה."], "ans": 0, "exp": "יעל איחרה ביחס להבטחתה. דאגת אמה מתאימה לסיפור. הגעה בזמן או אי-הגעה למסיבה סותרות את הנתונים, והאפשרות על מסיבה שהסתיימה לפני שהתחילה אינה הגיו  if(!o||o.done||sectionFrozen()||!Array.isArray(o.arr))return false;
 from=+from;to=+to;
 if(!Number.isInteger(from)||!Number.isInteger(to)||from===to||from<0||to<0||from>=o.arr.length||to>=o.arr.length)return false;
 const [x]=o.arr.splice(from,1);o.arr.splice(to,0,x);o.touched=true;return true;
}
function mv(i,d){if(!reorder(cur(),i,i+d))return;render()}
function bindDrag(o){
 const ul=$("ord");
 if(!ul||!ul.querySelectorAll||!o||o.done||sectionFrozen())return;
 let from=null,pid=null,startY=0,moved=false,origin=null;
 const rows=()=>[...ul.querySelectorAll("li")];
 function nearest(y){
  const list=rows();
  let best=0,dist=1/0;
  list.forEach((el,i)=>{const r=el.getBoundingClientRect();const d=Math.abs(y-(r.top+r.height/2));if(d<dist){dist=d;best=i}});
  return best;
 }
 function clear(){rows().forEach(el=>el.classList.remove("drag","over"));from=null;pid=null;origin=null;moved=false}
 rows().forEach(li=>{
  li.addEventListener("dragstart",e=>e.preventDefault());
  li.addEventListener("pointerdown",e=>{
   if(o.done||sectionFrozen()||(e.button!=null&&e.button>0))return;
   if(e.target&&e.target.closest&&e.target.closest("button"))return;
   from=+li.dataset.i;origin=li;pid=e.pointerId;startY=e.clientY;moved=false;
   try{li.setPointerCapture(e.pointerId)}catch(err){}
  });
  li.addEventListener("pointermove",e=>{
   if(from===null||li!==origin||e.pointerId!==pid)return;
   if(Math.abs(e.clientY-startY)>8)moved=true;
   if(moved&&e.cancelable)e.preventDefault();
   const to=nearest(e.clientY);
   if(moved)li.classList.add("drag");
   rows().forEach((el,i)=>el.classList.toggle("over",moved&&i===to&&i!==from));
  },{passive:false});
  li.addEventListener("pointerup",e=>{
   if(from===null||li!==origin||e.pointerId!==pid)return;
   const src=from,drop=moved?nearest(e.clientY):src;
   clear();
   if(reorder(o,src,drop))render();
  });
  li.addEventListener("pointercancel",()=>{if(li===origin)clear()});
 });
}

/* ===== סיכום פרק וסיום ===== */
function toReview(){if(sectionFrozen())return;S.view="review";render()}
function renderReview(){
 const sec=S.secs[S.cur];
 if(sec.done){S.view="q";render();return}
 const un=sec.qs.filter(x=>!hasAnswer(x)).length,fl=sec.qs.filter(x=>x.flag).length;
 placeDock(false);
 let h=`<div class="card"><h2>סיכום פרק ${sec.ch}: ${CH[sec.ch].name}</h2>
 <div class="top"><span></span><button type="button" class="tap" onclick="abandonSession()">יציאה</button></div>
 <p class="small">רענון הדפדפן ממשיך את הסשן הזה. יציאה מוחקת אותו.</p>
 <p>${un?`<b class="no">${un} שאלות ללא תשובה.</b>`:`<b class="ok">כל השאלות נענו.</b>`} ${fl?`${fl} מסומנות לבדיקה.`:""} ${timerHtml(sec,false)}</p>
 <div class="bar">${sec.qs.map((x,i)=>`<button class="${hasAnswer(x)?"ans":""} ${x.flag?"flg":""}" onclick="goQ(${i})">${i+1}${x.flag?" ⚑":""}${hasAnswer(x)?"":" ✗"}</button>`).join("")}</div>
 <p class="small">ניחוש עדיף על השארת שאלה ריקה. אפשר לחזור לכל שאלה לפני הסיום.</p>
 <button class="primary" onclick="finishSection()">${S.mode==="sim"&&S.cur<S.secs.length-1?"סיום פרק והמשך לפרק הבא":"סיום והצגת תוצאות"}</button></div>`;
 $("app").innerHTML=h;
 persistLive();
}
function finishSection(){
 stopTimer();
 if(!S||!S.secs||!S.secs[S.cur]||S.secs[S.cur].done)return;
 S.secs[S.cur].done=true;
 if(S.mode==="sim"&&S.cur<S.secs.length-1){S.cur++;runSection();return}
 results();
}
function results(){
 stopTimer();
 let tot=0,cor=0,rows="";
 S.secs.forEach(sec=>{let c=0;sec.qs.forEach(o=>{const ok=isCorrect(o);if(ok)c++;tot++;store.res[o.q.id]={ok:!!ok,ts:Date.now()}});cor+=c;
  rows+=`<tr><td>פרק ${sec.ch}: ${CH[sec.ch].name}</td><td>${c} מתוך ${sec.qs.length}</td></tr>`});
 store.sess.push({d:new Date().toLocaleDateString("he-IL"),m:S.mode==="sim"?"סימולציה מלאה":S.label,c:cor,t:tot});store.live=null;save();
 let h=`<div class="card"><h2>תוצאות: ${cor} מתוך ${tot}</h2><table>${rows}</table></div><div class="card"><h3>סקירת שאלות</h3>`;
 S.secs.forEach(sec=>sec.qs.forEach((o,i)=>{const q=o.q,ok=isCorrect(o);
  let mine="";if(q.t==="mc")mine=o.ans===null?"לא נענתה":q.opts[o.ans];else if(q.t==="typed")mine=o.ans?o.ans:"לא נענתה";else if(q.t==="order")mine=o.touched?o.arr.join(" ← "):"לא סודרה";else mine=o.ans===null?"לא נענתה":"צורה "+(o.perm.indexOf(o.ans)+1);
  const corr=q.t==="mc"?q.opts[q.ans]:q.t==="typed"?q.ans:q.t==="order"?q.items.join(" ← "):(q.t==="shape"?"הצורה הנכונה מוצגת במסך השאלה (תשובה: "+(o.perm.indexOf(q.ans)+1)+" מימין לפי הסדר שהוצג)":"");
  h+=`<div style="border-bottom:1px solid #ddd;padding:8px 0"><b>פרק ${sec.ch}, שאלה ${i+1}</b> <span class="${ok?"ok":"no"}">${ok?"נכון":"לא נכון"}</span>${q.chart?chartHtml(q.chart):""}<div class="q" style="font-size:17px;margin:4px 0">${show(q.q)}</div>`+
  (q.t==="shape"?(q.matrix?matrixHtml(q.seq,56)+`<div class="box" role="img" aria-label="${escAttr("התשובה: "+shapeName(q.opts[q.ans]))}" style="border-color:#2a9d4b">${svg(q.opts[q.ans],56)}</div>`:seqStrip(q.seq,56,`<div class="box" role="img" aria-label="${escAttr("התשובה: "+shapeName(q.opts[q.ans]))}" style="border-color:#2a9d4b">${svg(q.opts[q.ans],56)}</div>`)):`<div class="small">התשובה שלך: ${show(mine)}${ok?"":" · התשובה הנכונה: "+show(corr)}</div>`)+
  `<div class="exp">${show(q.exp)}</div></div>`}));
 h+=`</div><button type="button" class="primary tap" onclick="home()">חזרה לתפריט</button>`;
 $("app").innerHTML=h;placeDock(false);S=null;
}

if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("pagehide",()=>{if(S)persistLive()});
let D=null;
function dayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function levelFor(ch){return clampLevel(store.mastery[ch]&&store.mastery[ch].level)}
function familyOf(q){return q.origin==="v2-parameter-variation"?"v:"+q.rule:"o:"+q.sub}
function questionsForDay(day){
 const n=Number(String(day).replaceAll("-",""));
 const chapters=[0,1,2,3].map(i=>(n+i)%6+1);
 return chapters.map((ch,slot)=>{
  const level=levelFor(ch);
  let pool=BANK.filter(q=>served(q)&&q.ch===ch&&q.level===level&&q.example);
  if(!pool.length)pool=BANK.filter(q=>served(q)&&q.ch===ch&&q.example);
  const fams={};
  pool.forEach(q=>{const k=familyOf(q);(fams[k]||(fams[k]=[])).push(q)});
  const keys=Object.keys(fams).sort();
  const fam=keys[(n+slot)%keys.length];
  const arr=fams[fam];
  return arr[(Math.floor(n/6)+slot)%arr.length];
 });
}
function escAttr(s){return esc(s).replace(/"/g,"&quot;")}
function chartHtml(c){
 const vals=c.values.map(Number);
 const max=Math.max(...vals,1);
 const cols=c.labels.map((lab,i)=>{
  const h=Math.max(4,Math.round(100*vals[i]/max));
  return `<div class="col"><span class="small">${esc(c.values[i])} ${esc(c.unit||"")}</span><i class="bar" style="height:${h}px"></i><span class="lab">${esc(lab)}</span></div>`;
 }).join("");
 return `<div class="chart"><b>${esc(c.title||"")}</b><div class="bars">${cols}</div></div>`;
}
function persistDaily(){
 if(!D)return;
 store.daily[D.day]={complete:false,day:D.day,index:D.index,example:!!D.example,feedback:D.feedback===true?true:D.feedback===false?false:null,draft:D.draft==null?"":String(D.draft),choice:D.choice==null?null:D.choice,perm:Array.isArray(D.perm)?D.perm.slice():null,arr:Array.isArray(D.arr)?D.arr.slice():null,touched:!!D.touched,answers:D.answers.map(a=>({id:a.id,ch:a.ch,ok:!!a.ok})),ids:D.qs.map(q=>q.id)};
 save();
}
function isIndexPerm(perm,n){
 if(!Array.isArray(perm)||perm.length!==n)return false;
 const seen={};
 for(const x of perm){
  if(!Number.isInteger(x)||x<0||x>=n||seen[x])return false;
  seen[x]=1;
 }
 return true;
}
function isItemOrder(arr,items){
 if(!Array.isArray(arr)||!Array.isArray(items)||arr.length!==items.length)return false;
 const need={};
 for(const item of items){const k=String(item);need[k]=(need[k]||0)+1}
 for(const item of arr){const k=String(item);if(!need[k])return false;need[k]--}
 return items.every(item=>need[String(item)]===0);
}
function boundedChoice(choice,n){
 if(choice==null||choice==="")return null;
 choice=Number(choice);
 if(!Number.isInteger(choice)||choice<0||choice>=n)return null;
 return choice;
}
function answerFits(a,q){return !!a&&!!q&&a.id===q.id&&Number(a.ch)===Number(q.ch)}
function restoreDaily(qs,saved){
 const raw=Array.isArray(saved.answers)?saved.answers:[];
 let answers=[];
 for(let i=0;i<raw.length&&i<qs.length;i++){
  if(!answerFits(raw[i],qs[i]))break;
  answers.push({id:raw[i].id,ch:Number(raw[i].ch),ok:!!raw[i].ok});
 }
 let index=saved.index|0;
 let feedback=saved.feedback===true?true:saved.feedback===false?false:null;
 const unanswered=feedback===null&&answers.length===index&&index>=0&&index<=3;
 const answered=(feedback===true||feedback===false)&&answers.length===index+1&&index>=0&&index<=3&&answerFits(answers[index],qs[index])&&feedback===!!answers[index].ok;
 let example=saved.example!==false;
 let draft=saved.draft==null?"":String(saved.draft);
 let choice=saved.choice;
 let perm=Array.isArray(saved.perm)?saved.perm.slice():null;
 let arr=Array.isArray(saved.arr)?saved.arr.slice():null;
 let touched=!!saved.touched;
 if(!unanswered&&!answered){
  if((feedback===true||feedback===false)&&answers.length===index+1&&index>=0&&index<=3&&answerFits(answers[index],qs[index]))answers=answers.slice(0,index);
  index=Math.min(answers.length,3);
  feedback=null;
  if(answers.length>index)answers=answers.slice(0,index);
  example=true;draft="";choice=null;perm=null;arr=null;touched=false;
 }else{
  const q=qs[index];
  if(q.t==="mc"||q.t==="shape"){
   const n=Array.isArray(q.opts)?q.opts.length:0;
   if(!isIndexPerm(perm,n))perm=null;
   choice=boundedChoice(choice,n);
   arr=null;touched=false;
  }else if(q.t==="order"){
   if(!isItemOrder(arr,q.items)){arr=null;touched=false}
   choice=null;perm=null;
  }else{choice=null;perm=null;arr=null;touched=false}
 }
 if(feedback===null&&answers.length===index)example=true;
 return {index,answers,example,feedback,draft,choice,perm,arr,touched};
}
function dailyStart(){
 stopTimer();
 const day=dayKey();
 const saved=store.daily[day];
 if(saved&&saved.complete){dailySummary(saved);return}
 if(saved&&saved.complete===false&&Array.isArray(saved.ids)&&saved.ids.length===4){
  const qs=saved.ids.map(id=>BANK.find(q=>q.id===id&&served(q)&&q.example));
  if(qs.every(Boolean)){
   D=Object.assign({day,qs},restoreDaily(qs,saved));
   dailyRender();
   return;
  }
 }
 D={day,qs:questionsForDay(day),index:0,answers:[],example:true,feedback:null,draft:"",choice:null,perm:null,arr:null,touched:false};
 persistDaily();
 dailyRender();
}
function ensureDailyChoice(){
 const q=D.qs[D.index];
 if(q.t==="mc"||q.t==="shape"){
  const n=Array.isArray(q.opts)?q.opts.length:0;
  if(!isIndexPerm(D.perm,n))D.perm=shuffle(q.opts.map((_,i)=>i));
  D.choice=boundedChoice(D.choice,n);
 }
 if(q.t==="order"&&!isItemOrder(D.arr,q.items)){
  D.arr=shuffle(q.items.slice());
  if(D.arr.join("|")===q.items.join("|"))D.arr.reverse();
  D.touched=false;
 }
}
function dailyRender(){
 if(!D||!D.qs||!D.qs[D.index]){placeDock(false);$("app").innerHTML='<div class="card"><p>לא נמצאה שאלה לתרגול.</p><button type="button" class="primary tap" onclick="home()">חזרה</button></div>';return}
 const q=D.qs[D.index];
 const revealed=D.feedback!==null;
 let h=`<div class="card">${storageOn?"":`<p><b>ההתקדמות לא נשמרת.</b></p>`}<div class="top"><b>מסע היום · ${D.index+1}/4 · רמה ${q.level} · בלי שעון</b><button type="button" class="tap" onclick="dailyBack()">חזרה</button></div>`;
 if(D.example){
  placeDock(false);
  h+=`<h2>קודם מבינים את הדרך</h2><div class="exp">${show(q.example)}</div><p>קראו את הדרך ואז נסו שאלה דומה. מותר לטעות.</p><button type="button" class="primary tap" onclick="D.example=false;ensureDailyChoice();persistDaily();dailyRender()">עכשיו אני מנסה</button>`;
 }else{
  ensureDailyChoice();
  if(q.chart)h+=chartHtml(q.chart);
  h+=`<div class="q">${show(q.q)}</div>`;
  if(q.t==="typed")h+=`<input id="dailyAnswer" type="text" inputmode="decimal" autocomplete="off" aria-label="תשובה" value="${escAttr(D.draft==null?"":String(D.draft))}" oninput="dailyDraft(this.value)" ${revealed?"disabled":""}>`;
  else if(q.t==="mc")h+=D.perm.map(i=>`<button type="button" class="opt ${!revealed&&D.choice===i?"sel":""} ${revealed&&i===q.ans?"good":""} ${revealed&&D.choice===i&&i!==q.ans?"bad":""}" data-choice="${i}" onclick="dailyPick(${i})" ${revealed?"disabled":""}>${markHtml(revealed,i===q.ans,D.choice===i)}${show(q.opts[i])}</button>`).join("");
  else if(q.t==="shape"){
   if(q.matrix)h+=matrixHtml(q.seq,86);
   else h+=seqStrip(q.seq,64,QMARK);
   h+=`<p class="small">בחרו:</p><div class="optsvg" style="justify-content:center">`+D.perm.map(i=>`<button type="button" class="opt ${!revealed&&D.choice===i?"sel":""} ${revealed&&i===q.ans?"good":""} ${revealed&&D.choice===i&&i!==q.ans?"bad":""}" data-choice="${i}" aria-label="${escAttr(shapeName(q.opts[i])+markName(revealed,i===q.ans,D.choice===i))}" aria-pressed="${D.choice===i?"true":"false"}" onclick="dailyPick(${i})" ${revealed?"disabled":""}>${markHtml(revealed,i===q.ans,D.choice===i)}<div class="box" style="border:0">${svg(q.opts[i],80)}</div></button>`).join("")+`</div>`;
  }else if(q.t==="order"){
   h+=`<p class="small">הפריט הראשון למעלה. השתמשו בחצים.</p><ul class="ord">`+D.arr.map((t,i)=>`<li><span class="n">${i+1}</span><span class="t">${esc(t)}</span><button type="button" onclick="dailyMove(${i},-1)" ${revealed?"disabled":""}>▲</button><button type="button" onclick="dailyMove(${i},1)" ${revealed?"disabled":""}>▼</button></li>`).join("")+`</ul>`;
  }
  if(revealed){
   const corr=q.t==="typed"?` התשובה: <span dir="ltr" class="formula">${esc(q.ans)}</span>`:q.t==="order"?` הסדר: ${esc(q.items.join(" ← "))}`:"";
   h+=`<div class="exp"><b>${D.feedback?"נכון!":"לומדים מהניסיון."}</b>${corr}<br>${show(q.exp)}</div><p>המטרה היא להבין את הדרך, לא לצבור רצף.</p>`;
   h+=`<div class="dock"><button type="button" class="primary tap" onclick="dailyNext()">${D.index===3?"סיכום היום":"לדוגמה הבאה"}</button></div>`;
  }else h+=`<div class="dock"><button type="button" class="primary tap" onclick="dailyCheck()">בדיקה</button></div>`;
 }
 $("app").innerHTML=h+"</div>";
 placeDock(!D.example);
 dailyBind();
}
function captureDraft(){
 if(!D||D.example||!D.qs[D.index]||D.qs[D.index].t!=="typed"||D.feedback!==null)return;
 const input=$("dailyAnswer");
 if(input&&typeof input.value==="string")D.draft=input.value;
}
function dailyDraft(v){
 if(!D||D.feedback!==null)return;
 D.draft=v==null?"":String(v);
 persistDaily();
}
function dailyBack(){captureDraft();persistDaily();home()}
function dailyBind(){
 if(!D||D.example||D.qs[D.index].t!=="typed")return;
 const input=$("dailyAnswer");
 if(!input)return;
 if(input.addEventListener){
  input.addEventListener("input",()=>{if(typeof input.value==="string")dailyDraft(input.value)});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();dailyCheck()}});
 }
 if(D.feedback===null&&input.focus)input.focus();
}
function dailyPick(i){if(!D||D.feedback!==null)return;const q=D.qs[D.index];const n=q&&Array.isArray(q.opts)?q.opts.length:0;i=boundedChoice(i,n);if(i==null)return;D.choice=i;persistDaily();dailyRender()}
function dailyMove(i,d){if(!D||D.feedback!==null||!Array.isArray(D.arr))return;const j=i+d;if(j<0||j>=D.arr.length)return;[D.arr[i],D.arr[j]]=[D.arr[j],D.arr[i]];D.touched=true;persistDaily();dailyRender()}
function dailyCheck(){
 if(!D||D.feedback!==null)return;
 const q=D.qs[D.index];
 let ok=false;
 if(q.t==="typed"){
  const raw=$("dailyAnswer").value.trim().replace(",",".");
  if(!raw){alert("כתבו תשובה לפני הבדיקה");return}
  D.draft=raw;ok=Number(raw)===Number(q.ans);
 }else if(q.t==="mc"||q.t==="shape"){
  const n=Array.isArray(q.opts)?q.opts.length:0;
  D.choice=boundedChoice(D.choice,n);
  if(D.choice==null){alert("בחרו תשובה לפני הבדיקה");return}
  ok=D.choice===q.ans;
 }else if(q.t==="order"){
  if(!D.touched||!isItemOrder(D.arr,q.items)){alert("סדרו את הרשימה לפני הבדיקה");return}
  ok=D.arr.join("|")===q.items.join("|");
 }
 D.answers.push({id:q.id,ch:q.ch,ok});
 D.feedback=ok;persistDaily();dailyRender();
}
function applyMastery(answers){
 if(!Array.isArray(answers))return;
 const chs=[...new Set(answers.filter(a=>a).map(a=>a.ch))];
 chs.forEach(ch=>{
  let m=store.mastery[ch];
  if(!plain(m))m={level:1,history:[]};
  m.level=clampLevel(m.level);
  if(!Array.isArray(m.history))m.history=[];
  m.history.push(...answers.filter(a=>a&&a.ch===ch).map(a=>!!a.ok));
  if(m.history.length>=6){
   const recent=m.history.slice(-6),correct=recent.filter(Boolean).length;
   if(correct>=5)m.level=Math.min(3,m.level+1);
   else if(correct<=2)m.level=Math.max(1,m.level-1);
   m.history=[];
  }
  store.mastery[ch]=m;
 });
}
function dailyNext(){
 if(!D||D.feedback===null||D.finalized)return;
 if(D.index<3){D.index++;D.example=true;D.feedback=null;D.draft="";D.choice=null;D.perm=null;D.arr=null;D.touched=false;persistDaily();dailyRender();return}
 const prev=store.daily[D.day];
 if(prev&&prev.complete){dailySummary(prev);return}
 D.finalized=true;
 const entry={complete:true,answers:D.answers.map(a=>({id:a.id,ch:a.ch,ok:!!a.ok})),day:D.day};
 store.daily[D.day]=entry;
 applyMastery(entry.answers);
 save();
 dailySummary(entry);
}
function dailySummary(entry){
 const answers=Array.isArray(entry&&entry.answers)?entry.answers:[];
 const count=answers.filter(a=>a&&a.ok).length;
 placeDock(false);
 $("app").innerHTML=`<div class="card"><h2>השלמתם את מסע היום</h2><p>${count} מתוך 4 נכון. גם ניסיונות וקריאת הסבר הם חלק מהלמידה.</p><p>${storageOn?"המסע להיום נשמר בדפדפן הזה.":"ההתקדמות לא נשמרת."} אין קנס אם לא מתרגלים מחר.</p><button type="button" class="primary tap" onclick="home()">חזרה</button></div>`;
}

home();
