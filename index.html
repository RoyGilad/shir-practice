<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טיוטת תרגול</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:#eef2f5;color:#1b2a33;font-size:18px}
header{background:#1d7f8c;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:20px;margin:0}
header .note{font-size:13px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#backupCard{max-width:100%}
#backupText{display:block;width:100%;max-width:100%;min-height:96px;box-sizing:border-box;font:inherit;padding:8px;border:2px solid #b8c7cc;border-radius:8px}
#backupPreview{margin-top:10px;overflow-wrap:anywhere}
.backupActions{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.backupActions button{max-width:100%}
button{font:inherit;cursor:pointer;border:1px solid #1d7f8c;background:#fff;color:#1d7f8c;border-radius:8px;padding:8px 16px}
button.primary{background:#1d7f8c;color:#fff}
button:disabled{opacity:.4;cursor:default}
button.danger{border-color:#b33;color:#b33}
select{font:inherit;padding:6px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chip{display:inline-block;background:#e3f1f3;border-radius:12px;padding:2px 10px;font-size:14px;margin-inline-start:6px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.bar button{min-width:42px;padding:6px 8px}
.bar .cur{background:#1d7f8c;color:#fff}
.bar .ans{background:#cfe8d5}
.bar .flg{border-color:#d08a00;box-shadow:inset 0 0 0 2px #f2b84b}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-weight:bold;font-size:22px;color:#1d7f8c}
.timer.low{color:#c22}
.q{font-size:22px;line-height:1.6;margin:14px 0;white-space:pre-line}
.tap{min-height:44px;min-width:44px;padding:10px 16px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border:2px solid #b8c7cc;border-radius:10px;background:#fff;color:#1b2a33}
.opt.sel{border-color:#1d7f8c;background:#e3f1f3}
.opt.good,.opt.sel.good{border-color:#1e7a38;background:#bfe8cc}
.opt.bad,.opt.sel.bad{border-color:#a32020;background:#f5b4b4}
.opt .mark,.ord li .mark,.ansline .mark,.pick .mark{flex:0 0 auto;width:1.25em;font-size:22px;font-weight:bold;line-height:1;text-align:center}
.good .mark{color:#1e7a38}
.bad .mark{color:#a32020}
.optsvg .opt.bad .box,.optsvg .opt.sel.bad .box,.box.badbox{background:#f5b4b4;box-shadow:inset 0 0 0 4px #a32020}
.optsvg .opt.good .box,.optsvg .opt.sel.good .box,.box.goodbox{background:#bfe8cc;box-shadow:inset 0 0 0 4px #1e7a38}
.ord li.bad{border-color:#a32020;background:#f5b4b4}
.ord li.good{border-color:#1e7a38;background:#bfe8cc}
.ansline{display:flex;align-items:center;gap:8px}
input.bad{border-color:#a32020;background:#f5b4b4}
input.good{border-color:#1e7a38;background:#bfe8cc}
input.bad:disabled,input.good:disabled{opacity:1;color:#1b2a33;-webkit-text-fill-color:#1b2a33}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:10px;padding:8px 12px;margin:6px 0}
.pick.bad{border:2px solid #a32020;background:#f5b4b4}
.pick.good{border:2px solid #1e7a38;background:#bfe8cc}
button.opt:disabled{opacity:1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-top:1px solid #d5e1e4;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(27,42,51,.06)}
.optsvg{display:flex;flex-wrap:wrap;gap:12px}
.optsvg .opt{width:auto;padding:6px}
.seq{display:flex;flex-wrap:nowrap;gap:6px;align-items:flex-end;direction:ltr;unicode-bidi:isolate;justify-content:flex-start;overflow-x:auto;max-width:100%;padding-bottom:8px;scrollbar-color:#1d7f8c #d5e1e4}
.seq::-webkit-scrollbar{height:8px}
.seq::-webkit-scrollbar-thumb{background:#1d7f8c;border-radius:4px}
.seq .step{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:40px;max-width:72px;gap:2px}
.seq .sn{font-size:13px;font-weight:bold;line-height:1;color:#1d7f8c}
.formula{direction:ltr;unicode-bidi:isolate;display:inline-block}
.box{border:2px solid #888;border-radius:8px;background:#fff;padding:2px;display:inline-block}
.qmark{display:flex;align-items:center;justify-content:center;font-size:44px;color:#999;width:88px;height:88px}
.matrix{display:grid;grid-template-columns:repeat(3,92px);gap:6px;justify-content:center;direction:ltr;unicode-bidi:isolate;overflow-x:auto;max-width:100%}
.seq .box{display:flex;align-items:center;justify-content:center;width:100%;height:auto;aspect-ratio:1}
.seq svg{width:100%;height:auto;display:block}
.seq .qmark{width:100%;height:auto;aspect-ratio:1;font-size:22px}
.ord{list-style:none;padding:0;margin:10px 0}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #b8c7cc;border-radius:10px;padding:8px 12px;margin:6px 0;cursor:grab;touch-action:none;user-select:none}
.ord li .n{font-weight:bold;color:#1d7f8c;width:22px}
.ord li span.t{flex:1}
.ord li.drag{opacity:.4}
.ord li.over{border-color:#1d7f8c;background:#f3fbfb}
.ord.lock li{cursor:default;touch-action:auto}
.ord button{padding:2px 10px;touch-action:manipulation}
input[type=text]{font:inherit;padding:10px;border:2px solid #b8c7cc;border-radius:8px;width:200px;direction:ltr;text-align:center}
.exp{background:#fff7e0;border-radius:8px;padding:10px 14px;margin-top:10px;white-space:pre-line}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:right}
.ok{color:#2a9d4b;font-weight:bold}.no{color:#c33;font-weight:bold}
.lvlrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;justify-content:center}
.lvlchip{font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor;opacity:.6;white-space:nowrap}
.lvlchip.cur{opacity:1;font-weight:700}
.lvlchip.lvl1{color:#1f7a4d}.lvlchip.lvl2{color:#8a6100}.lvlchip.lvl3{color:#a33a6a}
body[data-theme="night"] .lvlchip.lvl1{color:#2ee6c5}body[data-theme="night"] .lvlchip.lvl2{color:#ffd166}body[data-theme="night"] .lvlchip.lvl3{color:#ff8fb8}
body[data-theme="night"] .lvlchip.cur{background:rgba(255,255,255,.12)}
.small{font-size:14px;color:#556}
.pbar{background:#dde;border-radius:6px;height:8px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:#1d7f8c}
details.card>summary{cursor:pointer;font-weight:bold;font-size:18px;min-height:44px;display:flex;align-items:center}
details.card>summary+p{margin-top:12px}
.chart{margin:12px 0;padding:12px;background:#f4fafa;border-radius:8px}
.chart b{display:block;margin-bottom:8px}
.bars{display:flex;gap:12px;align-items:flex-end;justify-content:center;direction:ltr;min-height:140px}
.bars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:72px}
.bars .bar{display:block;width:36px;background:#1d7f8c;border-radius:6px 6px 0 0}
.bars .lab{font-size:14px;margin-top:4px}
.marks{display:inline-flex;gap:6px;align-items:center;margin-inline-start:8px;vertical-align:middle}
.markdot{width:10px;height:10px;border-radius:50%;border:2px solid #1d7f8c;background:transparent;display:inline-block}
.markdot.on{background:#1d7f8c}
.trophies{display:inline-flex;gap:6px;align-items:center;vertical-align:middle}
.trophies svg{width:22px;height:22px;display:block}
.trophies.big{gap:10px;margin:2px 0 12px}
.trophies.big svg{width:44px;height:44px}
.trophies .cup{fill:none;stroke:#9aaeb4;stroke-width:1.6}
.trophies .cup.on{fill:#f2b705;stroke:#b98300}
.trophies .base{fill:#9aaeb4}
.trophies .cup.on+.base,.trophies .on-base{fill:#b98300}
.trophyline{font-size:15px;color:#4c6068;margin:-4px 0 10px}
.clocknote{font-weight:bold;font-size:22px;color:#1d7f8c;line-height:1.4}
.scoreline{font-size:22px;font-weight:bold;margin:8px 0}
details.link{margin-top:8px}
details.link>summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.dailyskin{background:#fff9ef;border:1px solid #d9d7dd;border-radius:18px;color:#252953}
.dailyskin .skinhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dailyskin .skinbrand{font-weight:bold;color:#28379b}
.dailyskin .skinhint{margin:0 0 8px}
.dailyskin .skinmark{width:28px;height:28px;flex:0 0 auto;display:inline-block;background:#ffbc8e;border:3px solid #334cc1;border-radius:40% 60% 50% 50%}
.dailyskin .skinmenu,.dailyskin .motionmenu{margin:8px 0 12px}
.dailyskin button{border-color:#334cc1;color:#334cc1}
.dailyskin button.primary,.dailyskin button[aria-pressed="true"]{background:#334cc1;color:#fff}
.dailyskin[data-skin="expedition"]{background:#eef8f8;border:1px solid #c2dddd;border-radius:21px;color:#203a42;box-shadow:0 4px 0 #deeeee}
.dailyskin[data-skin="expedition"] .skinbrand{color:#326b79}
.dailyskin[data-skin="expedition"] .skinmark{background:#e3f0eb;border:3px solid #397c8b;border-radius:4px;transform:rotate(45deg)}
.dailyskin[data-skin="expedition"] button{border-color:#397c8b;color:#326b79}
.dailyskin[data-skin="expedition"] button.primary,.dailyskin[data-skin="expedition"] button[aria-pressed="true"]{background:#397c8b;color:#fff}
@keyframes skinfloat{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes skinsway{from{transform:rotate(39deg)}to{transform:rotate(51deg)}}
@media (prefers-reduced-motion:no-preference){
 .dailyskin .skinmark{animation:skinfloat 1.1s ease-in-out infinite alternate}
 .dailyskin[data-skin="expedition"] .skinmark{animation:none}
 .dailyskin[data-skin="expedition"][data-motion="on"] .skinmark{animation:skinsway 1.6s ease-in-out infinite alternate}
}
.dailyskin[data-motion="off"] .skinmark{animation:none}
.dailyskin .stylefold{margin:0 0 4px}
.dailyskin .stylefold>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:bold}
.bar button.qnav-open{background:#fff;color:#1b2a33}
.bar button.qnav-filled{background:#e7edf2;color:#1b2a33}
.bar button.qnav-right{background:#1e7a38;color:#fff;border-color:#145c28}
.bar button.qnav-wrong{background:#a32020;color:#fff;border-color:#7d1414}
.qmarkstate{display:inline-block;min-width:1em;margin-inline-start:3px;font-weight:bold;line-height:1}
.bar button.qnav-right .qmarkstate{border-radius:50%;outline:2px solid #fff;padding:0 2px}
.bar button.qnav-wrong .qmarkstate{border-radius:0;outline:2px solid #fff;padding:0 2px}
.bar button.qnav-open .qmarkstate{border-radius:50%;outline:2px solid #1b2a33;padding:0 2px}
.bar button.qnav.cur{box-shadow:inset 0 0 0 3px #1b2a33}
.bar.navscroll{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;scroll-padding-inline:8px}
.bar.navscroll button{flex:0 0 auto}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;padding:0;list-style:none}
.stages li{min-height:44px;display:flex;align-items:center;padding:6px 10px;border:2px solid #b8c7cc;border-radius:999px;background:#fff;font-size:15px}
.stages li.on{background:#1d7f8c;color:#fff;border-color:#1d7f8c;font-weight:bold}
.topicrow{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:8px 0}
.topicrow button{text-align:right;width:100%}
.topicrow button:disabled{opacity:.55}
#challengeAsk,#challengeTopics,#challengePause,#challengeEntry{max-width:100%}

header{position:relative}
.hamb{position:absolute;top:50%;inset-inline-end:auto;left:14px;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:12px;font-size:22px;line-height:1;padding:8px 12px;cursor:pointer}
.ppanel{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;overflow:auto;padding:24px 14px}
.ppanel-inner{max-width:520px;margin:0 auto;background:#fff}
.ppanel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#morePractice>summary{display:none}
/* parents overlay: uniform action sizes - variants differ only by color */
#parentsPanel #resetBox button{width:100%}
#backupCard{width:100%;box-sizing:border-box;border-radius:12px;padding:0;border:2px solid #1d7f8c;background:#fff}
#backupCard>summary{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:10px 20px;box-sizing:border-box;color:#1d7f8c;font-size:16px}
#backupCard[open]{padding:0 14px 10px}
#backupCard[open]>summary{padding:10px 6px}
.backupActions{display:flex;gap:8px;flex-wrap:wrap}
.backupActions button{flex:1 1 0;white-space:normal}
#morePractice:not([open]){display:none}
.hero .hero-btn{border-radius:12px}
.cta{display:block;width:min(280px,100%);margin:10px auto 0;min-height:52px;font-size:17px;font-weight:700;border-radius:12px;text-align:center}
.hero-btn.cta{font-size:17px;padding:10px 20px}
.card{border-radius:12px}
.kicker{margin:0 0 4px;font-weight:700;color:#1d7f8c;font-size:15px}
.hero-title{margin:0 0 6px;font-size:30px}
/* unified action-button system: one geometry (radius 12px, min-height 44px, padding 10px 20px, weight 700), three variants */
button{border:2px solid #1d7f8c;border-radius:12px;padding:10px 20px;min-height:44px;font-weight:700;background:#fff;color:#1d7f8c}
button.primary{background:#1d7f8c;color:#fff}
button.danger{border-color:#b33;color:#b33;background:#fff}
.hero-btn{font-size:20px;padding:14px 40px;border-radius:12px}
button.link{border:none;background:none;text-decoration:underline;text-underline-offset:3px}
.quietrow{text-align:center;margin:2px 2px 14px}
.extras{text-align:center;margin:2px 2px 16px}
.extras h3{margin:0 0 2px;color:#4c6068;font-size:17px}
.extras .small{margin:0 0 4px;color:#4c6068}
.hero{margin:6px 2px 18px;text-align:center}
.trophyrow{text-align:center;margin:0 0 6px}
.hero .lead{font-size:24px;font-weight:bold;margin:8px 0 14px;line-height:1.35}
.hero .status{font-size:15px;color:#4c6068;margin:-6px 0 12px}
.hero-btn{font-size:21px;font-weight:bold;padding:16px 52px;border-radius:999px;box-shadow:0 3px 10px rgba(29,127,140,.35)}
.challenge-card{background:linear-gradient(180deg,#ffffff 0%,#e9f6f7 100%)}
.challenge-card h2{margin-top:0}
.steps{display:flex;gap:8px;margin:10px 0 4px;padding:0;list-style:none}
.steps li{width:44px;height:44px;border-radius:50%;border:2px solid #b8c7cc;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px;color:#35505a}
.steps li.on{background:#1d7f8c;border-color:#1d7f8c;color:#fff;box-shadow:0 0 0 4px rgba(29,127,140,.18)}
.mini{box-shadow:none;border:1px solid #dbe4e7;background:#f8fafb;padding:10px 14px}
.mini summary{font-size:15px;color:#5b6d74}

 {"k": "arrow", "rot": 180}], "opts": [{"k": "arrow", "rot": 300}, {"k": "arrow", "rot": 270}, {"k": "arrow", "rot": 240}, {"k": "arrow", "rot": 180}], "ans": 0, "exp": "הצעד גדל ב-30 בכל פעם. מ-0 ל-30 הצעד הוא 30, מ-30 ל-90 הצעד הוא 60, ומ-90 ל-180 הצעד הוא 90. הצעד הבא גדול ב-30 מהצעד 90, כלומר 120, ו-180 ועוד 120 הם 300. חץ בסיבוב 270 מוסיף שוב 90. חץ בסיבוב 240 מוסיף שוב 60. חץ בסיבוב 180 מעתיק את השלב האחרון.", "id": "b20-seq-03", "level": 3, "example": "דוגמה: מודדים את הצעד בין שני שלבים סמוכים, ואז את הצעד שאחריו. שני צעדים שווים לא מספרים לבד מה יהיה הצעד הבא.", "checked": true, "review": "AWAITING", "origin": "b20", "demand": "the turn grows by 30 each step, from 30 to 60 to 90, so the next turn is 120; repeating the last turn is the miss"}, {"t": "shape", "ch": 6, "sub": "seq", "q": "איזו צורה באה אחר כך בסדרה?", "seq": [{"k": "arrow", "rot": 0}, {"k": "arrow", "rot": 45}, {"k": "arrow", "rot": 45}, {"k": "arrow", "rot": 90}, {"k": "arrow", "rot": 135}], "opts": [{"k": "arrow", "rot": 225}, {"k": "arrow", "rot": 180}, {"k": "arrow", "rot": 135}, {"k": "arrow", "rot": 90}], "ans": 0, "exp": "כל סיבוב הוא סכום שני הסיבובים שלפניו. 0 ועוד 45 הם 45, 45 ועוד 45 הם 90, ו-45 ועוד 90 הם 135. לכן 90 ועוד 135 הם 225. חץ בסיבוב 180 מוסיף רק 45 לסיבוב האחרון. חץ בסיבוב 135 מעתיק את השלב האחרון. חץ בסיבוב 90 מעתיק את השלב שלפני האחרון.", "id": "b20-seq-04", "level": 3, "example": "דוגמה: שני שלבים יכולים להצביע לאותו כיוון. שוויון כיוון לבדו לא קובע לאן יצביע השלב הבא.", "checked": true, "review": "AWAITING", "origin": "b20", "demand": "each rotation is the sum of the two rotations before it; adding only the latest gap, or copying a shown arrow, misses the sum"}, {"t": "shape", "ch": 6, "sub": "matrix", "q": "בחרו את הצורה החסרה:", "matrix": true, "seq": [{"k": "circle", "fill": 1}, {"k": "square", "fill": 0}, {"k": "tri", "fill": 1}, {"k": "tri", "fill": 1}, {"k": "square", "fill": 0}, {"k": "circle", "fill": 1}, {"k": "circle", "fill": 1}, {"k": "square", "fill": 0} function challengeBindDrag(){

 if(!ul||ul.id!=="challengeOrd"||!ul.querySelectorAll||!challengeUi||challengeUi.revealed)return;
 let from=null,pid=null,startY=0,moved=false,origin=null;
 const rows=()=>[...ul.querySelectorAll("li")];
 function nearest(y){
  const list=rows();
  let best=0,dist=1/0;
  list.forEach((el,i)=>{const r=el.getBoundingClientRect();const d=Math.abs(y-(r.top+r.height/2));if(d<dist){dist=d;best=i}});
  return best;
 }
 function clear(){rows().forEach(el=>el.classList.remove("drag","over"));from=null;pid=null;origin=null;moved=false}
 rows().forEach(li=>{
  li.addEventListener("pointerdown",e=>{
   if(!challengeUi||challengeUi.revealed||(e.button!=null&&e.button>0))return;
   if(e.target&&e.target.closest&&e.target.closest("button"))return;
   from=+li.dataset.i;origin=li;pid=e.pointerId;startY=e.clientY;moved=false;
   try{li.setPointerCapture(e.pointerId)}catch(err){}

   if(Math.abs(e.clientY-startY)>8)moved=true;

  },{passive:false});

 });

/* The short form is pinned to the 15 items its id rule picked on 2026-10-10
   (per level, the first item by id of sentence completion, nonsense words and next sentence,
   and the first two shape items). New bank items sort ahead of them, so the rule would
   change the simulation; the list keeps it unchanged. */
const SIM_IDS=["q2","phasec-verb-01","q4","q5","phasec-non-01","phasec-non-02","phasec-next-01","q7","phasec-next-02","q43","q44","q48","ship2-shape-03","q49","ship2-shape-07"];
function shortSimItems(){return SIM_IDS.map(id=>BANK.find(q=>q.id===id)).filter(q=>served(q)&&q.example)}
function startSim(){
 const raw=$("tpq")&&$("tpq").value;
 const tpq=parseFloat(raw);
 const items=shortSimItems();
 const verbal=items.filter(q=>q.ch!==6);
 const shapes=items.filter(q=>q.ch===6);
 const mk=(ch,list)=>({ch,qs:shuffle(list).map(prepare),idx:0,time:tpq?Math.round(tpq*60*list.length):null,done:false});
 const secs=[];
 if(verbal.length)secs.push(mk(1,verbal));
 if(shapes.length)secs.push(mk(6,shapes));
 if(!secs.length){alert("אין שאלות לטופס הקצר");return}
 S={mode:"sim",label:"סימולציית תרגול קצרה",secs,cur:0,view:"q"};
 runSection();
}
function practiceQuestions(c,sub){
 const pool=Q.filter(q=>inChapterPool(q)&&q.ch==c&&(!sub||q.sub===sub));
 const groups=[];
 const index={};
 pool.forEach(q=>{
  const k=q.sub||"";
  if(!index[k]){index[k]={sub:k,items:[]};groups.push(index[k])}
  index[k].items.push(q);
 });
 const out=[];
 shuffle(groups).forEach(b=>shuffle(b.items).forEach(q=>out.push(prepare(q))));
 return out;
}
function startPractice(c,sub){
 const qs=practiceQuestions(c,sub);
 if(!qs.length){alert("אין שאלות זמינות בנושא הזה");return}
 const key=progKey(c,sub);
 S={mode:"practice",pk:key,intro:[],label:`תרגול: ${CH[c].name}${sub?" – "+CH[c].subs[sub]:""}`,secs:[{ch:c,qs,idx:0,time:null,done:false}],cur:0,view:"q"};
 runSection();
}

function snapshotLive(session){

 if(!session||!Array.isArray(session.secs)||!session.secs.length)return null;
 const snap={mode:session.mode==="sim"?"sim":"practice",label:session.label==null?"":String(session.label),cur:session.cur|0,view:session.view==="review"?"review":"q",secs:session.secs.map(sec=>({ch:sec.ch,idx:sec.idx|0,time:sec.time==null?null:Math.max(0,Math.round(Number(sec.time))||0),done:!!sec.done,qs:sec.qs.map(o=>({id:o.q.id,ans:o.ans==null?null:(o.q.t==="typed"?String(o.ans):o.ans),flag:!!o.flag,done:!!o.done,perm:Array.isArray(o.perm)?o.perm.slice():null,arr:Array.isArray(o.arr)?o.arr.slice():null,touched:!!o.touched}))}))};

function progKey(ch,sub){return sub?String(ch)+":"+String(sub):String(ch)}
function keyFromSnap(snap){
 const sec=snap&&Array.isArray(snap.secs)?snap.secs[0]:null;
 if(!sec)return null;
 const ch=sec.ch;
 const text=String(snap.label||"");
 const sep=" – ";
 const at=text.indexOf(sep);
 if(at>=0&&CH[ch]){
  const name=text.slice(at+sep.length);
  for(const s in CH[ch].subs)if(CH[ch].subs[s]===name)return progKey(ch,s);
 }
 return progKey(ch);
}
function persistLive(opt){
 if(adopting||!storageOn||!S)return;
 const snap=snapshotLive(S);
 if(!snap)return;
 if(S.mode==="practice"){
  const key=S.pk||keyFromSnap(snap);
  if(!key)return;
  S.pk=key;
  if(!plain(store.prog))store.prog={};
  store.prog[key]=snap;
  rememberProgKey(key,snap);
  const patch={progKey:key,progVal:snap};
  if(store.live&&store.live.mode==="practice"){store.live=null;patch.liveSet=true;patch.live=null}
  savePatch(patch,opt||{});
  return;
 }
 store.live=snap;
 savePatch({liveSet:true,live:snap},opt||{});
}
function materialize(v){
 if(!plain(v)||(v.mode!=="sim"&&v.mode!=="practice")||!Array.isArray(v.secs)||!v.secs.length)return null;
 const secs=[];
 for(const sec of v.secs){
  if(!plain(sec)||!Array.isArray(sec.qs)||!sec.qs.length)return null;
  const kept=[];
  for(let i=0;i<sec.qs.length;i++){
   const item=sec.qs[i];
   if(!plain(item))return null;
   const q=Q.find(x=>x&&x.id===String(item.id)&&served(x));
   if(!q)continue;
   const o={q,ans:null,flag:!!item.flag,done:!!item.done,touched:false};
   if(q.t==="mc"||q.t==="shape"){
    const n=Array.isArray(q.opts)?q.opts.length:0;
    o.perm=isIndexPerm(item.perm,n)?item.perm.map(Number):shuffle(q.opts.map((_,i)=>i));
    o.ans=boundedChoice(item.ans,n);
   }else if(q.t==="order"){
    if(isItemOrder(item.arr,q.items)){o.arr=item.arr.map(x=>String(x));o.touched=!!item.touched}
    else{o.arr=shuffle(q.items.slice());if(o.arr.join("|")===q.items.join("|"))o.arr.reverse();o.touched=false}
   }else o.ans=item.ans==null?null:String(item.ans);
   kept.push({o:o,at:i});
  }
  if(!kept.length)continue;
  let want=Number(sec.idx);

 if(saved&&saved.complete){dailySummary(saved);return}
 if(saved&&saved.complete===false&&Array.isArray(saved.ids)&&saved.ids.length===4){
  const qs=saved.ids.map(id=>BANK.find(q=>q.id===id&&served(q)&&q.example));
  if(qs.every(Boolean)){
   D=Object.assign({day,qs},restoreDaily(qs,saved));
   dailyRender();
   return;
  }
 }
 D={day,qs:easyToHard(questionsForDay(day)),index:0,answers:[],example:true,feedback:null,draft:"",choice:null,perm:null,arr:null,touched:false};
 persistDaily();
 dailyRender();
}
function ensureDailyChoice(){
 const q=D.qs[D.index];
 if(q.t==="mc"||q.t==="shape"){
  const n=Array.isArray(q.opts)?q.opts.length:0;
  if(!isIndexPerm(D.perm,n))D.perm=shuffle(q.opts.map((_,i)=>i));
  D.choice=boundedChoice(D.choice,n);
 }
 if(q.t==="order"&&!isItemOrder(D.arr,q.items)){
  D.arr=shuffle(q.items.slice());
  if(D.arr.join("|")===q.items.join("|"))D.arr.reverse();
  D.touched=false;
 }
}
function dailyRender(){
 if(!D||!D.qs||!D.qs[D.index]){placeDock(false);$("app").innerHTML='<div class="card"><p>לא נמצאה שאלה לתרגול.</p><button type="button" class="primary tap" onclick="home()">חזרה</button></div>';return}
 screen="daily";
 const q=D.qs[D.index];
 const revealed=D.feedback!==null;
 let h=`<div class="card dailyskin" ${skinAttrs()}>${skinBlock()}${persistNote()}<div class="top"><div><b>מסע היום · ${D.index+1}/4 · ${q.ch===6?"צורות · רמה "+q.level:"היכרות"} · בלי שעון</b>${marksHtml(D.answers.length)}</div><button type="button" class="tap" onclick="dailyBack()">חזרה</button></div>${dailyQNavHtml()}${lvlRowHtml()}`;
 h+=`<p class="small">${q.ch===6?"רמת הצורות לפי סוג הכלל. זו הגדרת תרגול, לא כיול.":"הנושא הזה בתרגול היכרות, בלי עליית רמה."}</p>`;
 if(D.example){
  placeDock(false);
  h+=`<h2>קודם מבינים את הדרך</h2><div class="exp">${show(q.example)}</div><p>קראו את הדרך ואז נסו שאלה דומה. מותר לטעות.</p><button type="button" class="primary tap" onclick="D.example=false;ensureDailyChoice();persistDaily();dailyRender()">עכשיו אני מנסה</button>`;
 }else{
  ensureDailyChoice();
  if(q.chart)h+=chartHtml(q.chart);
  h+=`<div class="q">${show(q.q)}</div>`;
  if(q.t==="typed"){
   const tone=revealed?(D.feedback?"good":"bad"):"";
   h+=`<div class="ansline ${tone}">${markHtml(revealed,!!D.feedback,revealed&&!D.feedback)}<input id="dailyAnswer" class="${tone}" type="text" inputmode="decimal" autocomplete="off" aria-label="תשובה" value="${escAttr(D.draft==null?"":String(D.draft))}" oninput="dailyDraft(this.value)" ${revealed?"disabled":""}></div>`;
  }else if(q.t==="mc")h+=D.perm.map(i=>`<button type="button" class="opt ${choiceClass(revealed,i===q.ans,D.choice===i)}" data-choice="${i}" onclick="dailyPick(${i})" ${revealed?"disabled":""}>${markHtml(revealed,i===q.ans,D.choice===i)}${show(q.opts[i])}</button>`).join("");
  else if(q.t==="shape"){
   if(q.matrix)h+=matrixHtml(q.seq,86);
   else h+=seqStrip(q.seq,64,QMARK);
   h+=`<p class="small">בחרו:</p><div class="optsvg" style="justify-content:center">`+D.perm.map(i=>`<button type="button" class="opt ${choiceClass(revealed,i===q.ans,D.choice===i)}" data-choice="${i}" aria-label="${escAttr(shapeName(q.opts[i])+markName(revealed,i===q.ans,D.choice===i))}" aria-pressed="${D.choice===i?"true":"false"}" onclick="dailyPick(${i})" ${revealed?"disabled":""}>${markHtml(revealed,i===q.ans,D.choice===i)}<div class="box" style="border:0">${svg(q.opts[i],80)}</div></button>`).join("")+`</div>`;
  }else if(q.t==="order"){
   h+=`<p class="small">הפריט הראשון למעלה. השתמשו בחצים.</p>`+orderListHtml(D.arr,q.items,revealed,{lock:revealed,move:"dailyMove"});
  }
  if(revealed){
   const corr=q.t==="typed"?` התשובה: <span dir="ltr" class="formula">${esc(q.ans)}</span>`:q.t==="order"?` הסדר: ${esc(q.items.join(" ← "))}`:"";
   h+=linkHtml(q.exp)+`<div class="exp"><b>${D.feedback?"נכון!":"לומדים מהניסיון."}</b>${corr}<br>${show(q.exp)}</div><p>המטרה היא להבין את הדרך, לא לצבור רצף.</p>`;
   h+=`<div class="dock"><button type="button" class="primary tap" onclick="dailyNext()">${D.index===3?"סיכום היום":"לדוגמה הבאה"}</button></div>`;
  }else h+=`<div class="dock"><button type="button" class="primary tap" onclick="dailyCheck()">בדיקה</button></div>`;
 }
 $("app").innerHTML=h+"</div>";
 placeDock(!D.example);
 revealCurrentNav();
 dailyBind();
}
function captureDraft(){
 if(!D||D.example||!D.qs[D.index]||D.qs[D.index].t!=="typed"||D.feedback!==null)return;
 const input=$("dailyAnswer");
 if(input&&typeof input.value==="string")D.draft=input.value;
}
function dailyDraft(v){
 if(!D||D.feedback!==null)return;
 D.draft=v==null?"":String(v);
 persistDaily();
}
function dailyBack(){captureDraft();persistDaily();home()}
function dailyBind(){
 if(!D||D.example||D.qs[D.index].t!=="typed")return;
 const input=$("dailyAnswer");
 if(!input)return;
 if(input.addEventListener){
  input.addEventListener("input",()=>{if(typeof input.value==="string")dailyDraft(input.value)});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();dailyCheck()}});
 }
 if(D.feedback===null&&input.focus)input.focus();
}
function dailyPick(i){if(!D||D.feedback!==null)return;const q=D.qs[D.index];const n=q&&Array.isArray(q.opts)?q.opts.length:0;i=boundedChoice(i,n);if(i==null)return;D.choice=i;persistDaily();dailyRender()}
function dailyMove(i,d){if(!D||D.feedback!==null||!Array.isArray(D.arr))return;const j=i+d;if(j<0||j>=D.arr.length)return;[D.arr[i],D.arr[j]]=[D.arr[j],D.arr[i]];D.touched=true;persistDaily();dailyRender()}
function dailyCheck(){
 if(!D||D.feedback!==null)return;
 const q=D.qs[D.index];
 let ok=false;
 if(q.t==="typed"){
  const raw=$("dailyAnswer").value.trim().replace(",",".");
  if(!raw){alert("כתבו תשובה לפני הבדיקה");return}
  D.draft=raw;ok=Number(raw)===Number(q.ans);
 }else if(q.t==="mc"||q.t==="shape"){
  const n=Array.isArray(q.opts)?q.opts.length:0;
  D.choice=boundedChoice(D.choice,n);
  if(D.choice==null){alert("בחרו תשובה לפני הבדיקה");return}
  ok=D.choice===q.ans;
 }else if(q.t==="order"){
  if(!D.touched||!isItemOrder(D.arr,q.items)){alert("סדרו את הרשימה לפני הבדיקה");return}
  ok=D.arr.join("|")===q.items.join("|");
 }
 D.answers.push({id:q.id,ch:q.ch,sub:q.sub||"",ok});
 D.feedback=ok;persistDaily();dailyRender();
}
function applyMastery(answers){
 if(!Array.isArray(answers))return;
 const groups={};
 answers.forEach(a=>{
  if(!a)return;
  const q=BANK.find(x=>x&&x.id===String(a.id));
  const key=topicKey(q);
  if(!key)return;
  (groups[key]||(groups[key]=[])).push(!!a.ok);
 });
 Object.keys(groups).forEach(key=>{
  let m=store.mastery[key];
  if(!plain(m))m={level:1,history:[]};
  m.level=clampLevel(m.level);
  if(!Array.isArray(m.history))m.history=[];
  m.history.push(...groups[key]);
  if(m.history.length>=6){
   const recent=m.history.slice(-6),correct=recent.filter(Boolean).length;
   if(correct>=5)m.level=Math.min(3,m.level+1);
   else if(correct<=2)m.level=Math.max(1,m.level-1);
   m.history=[];
  }
  store.mastery[key]=m;
 });
}
function dailyNext(){
 if(!D||D.feedback===null||D.finalized)return;
 if(D.index<3){D.index++;D.example=true;D.feedback=null;D.draft="";D.choice=null;D.perm=null;D.arr=null;D.touched=false;persistDaily();dailyRender();return}
 const prev=store.daily[D.day];
 if(prev&&prev.complete){dailySummary(prev);return}
 D.finalized=true;
 const entry={complete:true,answers:D.answers.map(a=>({id:a.id,ch:a.ch,sub:a.sub||"",ok:!!a.ok})),day:D.day,ids:D.qs.map(q=>q.id)};
 store.daily[D.day]=entry;
 applyMastery(entry.answers);
 savePatch({dailyKey:D.day,dailyEntry:entry,mastery:store.mastery});
 dailySummary(entry);
}
function dailySummary(entry){
 if(entry)summaryHold=entry;
 else entry=summaryHold;
 screen="summary";
 const answers=Array.isArray(entry&&entry.answers)?entry.answers:[];
 const count=answers.filter(a=>a&&a.ok).length;
 placeDock(false);
 $("app").innerHTML=`<div class="card dailyskin" ${skinAttrs()}>${skinBlock()}<h2>השלמתם את מסע היום</h2>${trophiesHtml(4,true)}<p class="trophyline">4 גביעים להיום</p>${summaryQNavHtml(answers)}<p class="scoreline">${count} מתוך 4 נכון.</p><p class="scoreline">זה תרגול, לא תוצאת מבחן.</p><p>גם ניסיונות וקריאת הסבר הם חלק מהלמידה.</p><p>${savedDayLine()} אין קנס אם לא מתרגלים מחר.</p><p><button type="button" class="primary tap" onclick="continueUntimed()">המשך בלי שעון</button> <button type="button" class="tap" onclick="home()">חזרה</button></p></div>`;
}
function linkSentence(exp){
 const s=String(exp==null?"":exp).trim();
 const cut=s.search(/[.!?]/);
 if(cut<0)return s;
 return s.slice(0,cut+1).trim();
}
function linkHtml(exp){
 const line=linkSentence(exp);
 if(!line)return "";
 return `<details class="link"><summary>הקשר בקצרה</summary><p>${show(line)}</p></details>`;
}
function trophySvg(on){
 return `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="cup${on?" on":""}" d="M7 3h10v5a5 5 0 0 1-10 0V3z"/><path class="cup${on?" on":""}" d="M7 4.5H4.5v1.5A3 3 0 0 0 7.5 9M17 4.5h2.5v1.5A3 3 0 0 1 16.5 9"/><path class="cup${on?" on":""}" d="M12 13v4M8.5 20.5h7M9.5 17h5v3.5h-5z"/></svg>`;
}
function trophiesHtml(doneCount,big){
 const n=Math.max(0,Math.min(4,doneCount|0));
 const cups=[0,1,2,3].map(i=>trophySvg(i<n)).join("");
 return `<span class="trophies${big?" big":""}" role="img" aria-label="${n} מתוך 4 גביעים להיום">${cups}</span>`;
}
function marksHtml(doneCount){return trophiesHtml(doneCount,false)}
function continueUntimed(){
 stopTimer();
 S=null;
 store.live=null;
 savePatch({liveSet:true,live:null});
 home();
}


/* THEME (display only). Stored in the same ui blob as skin and motion (one storage key, no second key). The mock exam is always classic. */
let sessionTheme=null;
function themeNow(){
 if(sessionTheme==="classic"||sessionTheme==="night")return sessionTheme;
 let ui=null;try{ui=readMetaUi()}catch(e){}
 return ui&&ui.theme==="classic"?"classic":"night";
}
function effectiveTheme(){return(typeof S!=="undefined"&&S&&S.mode==="sim")?"classic":themeNow()}
function applyTheme(){
 try{
  const b=document.body;if(!b||!b.setAttribute)return;
  b.setAttribute("data-theme",effectiveTheme());
  try{document.documentElement.setAttribute("data-theme",effectiveTheme())}catch(e){}
  let m="reduced";try{m=currentMotion()}catch(e){}
  b.setAttribute("data-motion",m);
 }catch(e){}
}
function syncLookButtons(){
 try{const t=themeNow();document.querySelectorAll("[data-look]").forEach(el=>el.setAttribute("aria-pressed",el.getAttribute("data-look")===t?"true":"false"))}catch(e){}
}
function chooseTheme(v){
 v=v==="classic"?"classic":"night";
 sessionTheme=v;
 applyTheme();syncLookButtons();
 if(!canPersist())return;
 const saved=savePatch({uiSet:true,ui:{skin:currentSkin(),motion:currentMotion(),theme:v,setAt:new Date().toISOString()}});
 const settle=()=>{
  if(sessionTheme!==v)return;
  const ui=readMetaUi();
  if(ui&&ui.theme===v){sessionTheme=null;applyTheme();syncLookButtons()}
 };
 if(saved&&typeof saved.then==="function")saved.then(settle,function(){});
 else settle();
}
function lookPickHtml(){
 const on=v=>themeNow()===v?"true":"false";
 return `<div class="lookpick"><b>מראה</b><p class="small">איך האפליקציה נראית. סימולציית המבחן תמיד נראית קלאסית, בלי הסחות.</p><div class="lookrow"><button type="button" class="tap" data-look="night" aria-pressed="${on("night")}" onclick="chooseTheme('night')"><span class="sw n"></span>מסלול לילה</button><button type="button" class="tap" data-look="classic" aria-pressed="${on("classic")}" onclick="chooseTheme('classic')"><span class="sw c"></span>קלאסי</button></div></div>`;
}
function trailHtml(n){
 n=Math.max(0,Math.min(4,n|0));
 const pts=[[255,40],[110,98],[225,160],[95,222]];
 const d="M255 40 C 130 40 60 78 110 98 C 180 125 290 125 225 160 C 160 195 50 190 95 222";
 const cup=(x,y,on)=>`<g transform="translate(${x-14} ${y-14}) scale(1.17)"><path class="cup${on?" on":""}" d="M7 3h10v5a5 5 0 0 1-10 0V3z"/><path class="cup${on?" on":""}" d="M7 4.5H4.5v1.5A3 3 0 0 0 7.5 9M17 4.5h2.5v1.5A3 3 0 0 1 16.5 9"/><path class="cup${on?" on":""}" d="M12 13v4M8.5 20.5h7M9.5 17h5v3.5h-5z"/></g>`;
 let nodes="";
 pts.forEach((pt,i)=>{const on=i<n,cur=i===n;nodes+=`<circle class="node${on?" on":""}${cur?" cur":""}" cx="${pt[0]}" cy="${pt[1]}" r="${cur?27:23}"/>`+cup(pt[0],pt[1],on)});
 const pulse=n<4?`<circle class="pulse" cx="${pts[n][0]}" cy="${pts[n][1]}" r="36"/>`:"";
 const len=n===0?0:[0,70,170,300,400][n];
 return `<div class="trail" role="img" aria-label="${n} מתוך 4 גביעים להיום"><svg viewBox="0 0 320 250" aria-hidden="true"><path class="tpath" d="${d}"/><path class="tdone" d="${d}" pathLength="400" stroke-dasharray="${len} 400" style="--len:${len}"/>${pulse}${nodes}</svg></div>`;
}
initConcurrency();
applyTheme();
try{if(typeof MutationObserver!=="undefined"&&$("app"))new MutationObserver(applyTheme).observe($("app"),{childList:true})}catch(e){}
home();
</script>
